name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *" # Runs automatically every day at 12:30 PM UTC (6:00 PM IST)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: leetcode-problems # Optional: Change or remove this to put files in the root folder
          verbose: true
          commit-header: '[LeetCode Sync]'
